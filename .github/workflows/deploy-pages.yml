name: Deploy to GitHub Pages

# Publishes the static site to GitHub Pages. Runs on every push to the
# working branch (and can be triggered by hand from the Actions tab).
on:
  push:
    branches: ["claude/high-protein-cookbook-3Av3B"]
  workflow_dispatch:

# Permissions needed for the official Pages deployment action.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one Pages deployment at a time; don't cancel an in-progress one.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # The whole repo root is the site (no build step needed).
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
