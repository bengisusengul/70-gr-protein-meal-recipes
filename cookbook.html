<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The 70 g Protein Cookbook — Print Edition</title>
  <link rel="stylesheet" href="css/cookbook.css" />
  <style>
    .page-dedication{display:flex;align-items:center;justify-content:center}
    .dedication-text{font-style:italic;font-size:21px;line-height:1.5;color:#5b5048;text-align:center;max-width:62%}
    .page-welcome .welcome-p{font-size:15px;line-height:1.75;margin:0 0 13px;color:#2c2620}
    .welcome-sign{margin-top:18px;font-size:15px;color:#2c2620}
    .welcome-name{font-family:Georgia,serif;font-size:23px;color:#23402e;margin:2px 0 0}
    .page-about{text-align:center}
    .about-crest{width:184px;margin:6px auto 16px}
    .about-crest svg{width:100%;height:auto}
    .page-about .about-p{font-size:15px;line-height:1.75;text-align:left;color:#2c2620;margin:0 0 12px}
    .about-contact{font-weight:700;color:#2f7d52}
    .page-license .license-p{font-size:14.5px;line-height:1.75;color:#2c2620;margin:0 0 12px}
    .license-copy{margin-top:18px;color:#7a7066;font-size:13px}
    .page-closing{display:flex;align-items:center;justify-content:center;text-align:center}
    .page-closing .closing-title{font-family:Georgia,serif;font-size:31px;color:#23402e;margin:0 0 14px}
    .page-closing .closing-p{font-size:16px;line-height:1.6;max-width:78%;margin:0 auto 12px;color:#2c2620}
    .closing-sign{font-style:italic;margin-top:14px;color:#5b5048}
    .rcp-badges{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
    .rcp-badge{background:#eaf3ec;color:#256241;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700}
    .rcp-storage{font-size:12.5px;color:#5b5048;margin:6px 0}
    .rcp-nutri{font-size:11px;color:#7a7066;margin:8px 0 0}
    .cover-art .cover-collage{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:5px;width:100%;height:100%}
    .cover-art .cover-collage .cc-img{width:100%;height:100%;object-fit:cover;border-radius:6px;display:block}
    .divider-art img.divider-photo{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:10px;display:block}
  </style>
</head>
<body>
  <!-- on-screen only; hidden when printing / building the PDF -->
  <div class="screen-banner no-print">
    📖 This is the <strong>print / PDF edition</strong> of the cookbook (separate from the web app).
    To produce the sellable PDF, run <code>npm install</code> then <code>npm run build:pdf</code>,
    or use your browser's <strong>Print → Save as PDF</strong>.
  </div>

  <main id="book"></main>

  <script src="js/recipes-data.js"></script>
  <script src="js/science-data.js"></script>
  <script src="js/plans-data.js"></script>
  <script src="js/illustrations.js"></script>
  <script src="js/swaps.js"></script>
  <script src="js/recipe-images.js"></script>
  <script src="js/recipes-extra.js"></script>
  <script src="js/cookbook.js"></script>
</body>
</html>
